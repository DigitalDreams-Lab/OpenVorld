name: Desktop builds
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the builds as a GitHub release named after the version'
        type: boolean
        default: true
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: windows-latest, arch: x64 }
          - { os: ubuntu-24.04, arch: x64 }
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run validate
      - name: Include the version's changelog in update metadata
        shell: bash
        run: node tools/release-notes.mjs > release-notes.md
      - name: Build installers and update manifests
        shell: bash
        run: |
          SIGNING=()
          if [ "$RUNNER_OS" = 'macOS' ] && [ -n "$CSC_LINK" ]; then
            if [ -z "$CSC_NAME" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo '::error::Mac signing needs MAC_SIGNING_IDENTITY, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID.'
              exit 1
            fi
            SIGNING+=("--config.mac.identity=$CSC_NAME" '--config.mac.hardenedRuntime=true' '--config.mac.notarize=true' '--config.forceCodeSigning=true')
          fi
          npm run desktop:dist -- --${{ matrix.arch }} --publish never --config.publish.channel=latest-${{ matrix.arch }} --config.releaseInfo.releaseNotesFile=release-notes.md "${SIGNING[@]}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: '${{ runner.os == ''macOS'' && secrets.MAC_CERTIFICATE || runner.os == ''Windows'' && secrets.WIN_CERTIFICATE || '''' }}'
          CSC_KEY_PASSWORD: '${{ runner.os == ''macOS'' && secrets.MAC_CERTIFICATE_PASSWORD || runner.os == ''Windows'' && secrets.WIN_CERTIFICATE_PASSWORD || '''' }}'
          CSC_NAME: '${{ secrets.MAC_SIGNING_IDENTITY }}'
          APPLE_ID: '${{ secrets.APPLE_ID }}'
          APPLE_APP_SPECIFIC_PASSWORD: '${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}'
          APPLE_TEAM_ID: '${{ secrets.APPLE_TEAM_ID }}'
      - name: Verify installer hashes and changelog in update manifests
        run: node tools/verify-updates.mjs
      - name: Verify packaged Windows sprites and portraits
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node desktop/smoke.mjs release/win-unpacked/OpenVorld.exe --sprites --profile
      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # the files are named OpenVorld-<version>-<os>-<arch>.<ext> (electron-builder.yml > artifactName); the artifact carries the version too
      - uses: actions/upload-artifact@v4
        with:
          name: 'OpenVorld-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}'
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/latest-*.yml
            release/*.blockmap

  # Stage all installers and update manifests in a draft before making the release visible to installed apps.
  release:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: A tag must name the version it builds
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but package.json says ${{ steps.version.outputs.version }}. Bump the version (npm run bump) or tag v${{ steps.version.outputs.version }}."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: 'OpenVorld-${{ steps.version.outputs.version }}-*'
          merge-multiple: true
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: '${{ steps.version.outputs.version }}'
        run: |
          TAG="v${VERSION}"
          ls -l dist
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          node tools/release-notes.mjs "${VERSION}" > notes.md
          if gh release view "${TAG}" --json isDraft --jq '.isDraft' > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" != 'true' ]; then
              echo '::error::Published versions are immutable. Bump the version before releasing again.'
              exit 1
            fi
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" dist/* --draft --target "${GITHUB_SHA}" --title "OpenVorld ${VERSION}" --notes-file notes.md
          fi
          gh release edit "${TAG}" --draft=false --latest
