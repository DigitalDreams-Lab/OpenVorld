name: Desktop builds
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the builds as a GitHub release named after the version'
        type: boolean
        default: true
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: windows-latest, arch: x64 }
          - { os: ubuntu-24.04, arch: x64 }
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
        if: runner.os == 'Linux'
      - name: Build installers and update manifests
        shell: bash
        run: |
          node tools/desktop-build.mjs --arch ${{ matrix.arch }}
        env:
          OPENVORLD_DISTRIBUTION: '${{ github.event_name != ''workflow_dispatch'' || inputs.release }}'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: '${{ runner.os == ''macOS'' && secrets.MAC_CERTIFICATE || runner.os == ''Windows'' && secrets.WIN_CERTIFICATE || '''' }}'
          CSC_KEY_PASSWORD: '${{ runner.os == ''macOS'' && secrets.MAC_CERTIFICATE_PASSWORD || runner.os == ''Windows'' && secrets.WIN_CERTIFICATE_PASSWORD || '''' }}'
          CSC_NAME: '${{ runner.os == ''macOS'' && secrets.MAC_SIGNING_IDENTITY || '''' }}'
          APPLE_ID: '${{ runner.os == ''macOS'' && secrets.APPLE_ID || '''' }}'
          APPLE_APP_SPECIFIC_PASSWORD: '${{ runner.os == ''macOS'' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '''' }}'
          APPLE_TEAM_ID: '${{ runner.os == ''macOS'' && secrets.APPLE_TEAM_ID || '''' }}'
      - name: Verify installer hashes and changelog in update manifests
        run: node tools/verify-updates.mjs
      - name: Smoke test the packaged Mac app
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: node desktop/smoke.mjs release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/OpenVorld.app ${{ matrix.arch == 'x64' && '--no-webgl' || '' }}
      - name: Verify packaged Windows sprites and portraits
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node desktop/smoke.mjs release/win-unpacked/OpenVorld.exe --sprites --profile
      - name: Save smoke test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 'smoke-${{ matrix.os }}-${{ matrix.arch }}'
          if-no-files-found: ignore
          path: release/smoke
      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # the files are named OpenVorld-<version>-<os>-<arch>.<ext> (electron-builder.yml > artifactName); the artifact carries the version too
      - uses: actions/upload-artifact@v4
        with:
          name: 'OpenVorld-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}'
          if-no-files-found: error
          path: |
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/latest-*.yml

  # Publish verified desktop downloads first, then advance the separate update feed atomically.
  release:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: A tag must name the version it builds
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but package.json says ${{ steps.version.outputs.version }}. Bump the version (npm run bump) or tag v${{ steps.version.outputs.version }}."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: 'OpenVorld-${{ steps.version.outputs.version }}-*'
          merge-multiple: true
          path: dist
      - name: Verify all four downloads and update manifests
        run: |
          node tools/verify-updates.mjs dist
          node --input-type=module -e "import {updateFeedFiles} from './tools/publish-update-feed.mjs'; updateFeedFiles('dist', JSON.parse((await import('node:fs')).readFileSync('package.json')).version)"
      - name: Publish the release
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: '${{ steps.version.outputs.version }}'
        run: |
          TAG="v${VERSION}"
          ARTIFACTS=("dist/OpenVorld-${VERSION}-mac-arm64.zip" "dist/OpenVorld-${VERSION}-mac-x64.zip" "dist/OpenVorld-${VERSION}-win-x64.exe" "dist/OpenVorld-${VERSION}-linux-x86_64.AppImage")
          node tools/release-notes.mjs "${VERSION}" > notes.md
          if gh release view "${TAG}" --json isDraft --jq '.isDraft' > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" != 'true' ]; then
              # A feed upload can be retried, but published desktop binaries must never change.
              gh release download "${TAG}" --dir published
              test "$(find published -type f | wc -l)" -eq 4
              for file in "${ARTIFACTS[@]}"; do cmp "$file" "published/$(basename "$file")"; done
              exit 0
            fi
            gh release upload "${TAG}" "${ARTIFACTS[@]}" --clobber
            gh release edit "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" "${ARTIFACTS[@]}" --draft --target "${GITHUB_SHA}" --title "OpenVorld ${VERSION}" --notes-file notes.md
          fi
          test "$(gh release view "${TAG}" --json assets --jq '.assets | length')" -eq 4
          gh release edit "${TAG}" --draft=false --latest
      - name: Publish the update feed
        env:
          GH_TOKEN: '${{ github.token }}'
        run: node tools/publish-update-feed.mjs dist
