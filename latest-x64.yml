releaseNotes: "- Codex members can get a net.cli writ: their shell commands
  reach the internet (all sites, only for this time or session, only in a
  writable workbench); a command that cannot resolve a host asks for it, and a
  revoked writ takes a resumed session offline again\r

  - Redrawn with Codex image generation: the back and back-right views of the
  grey-haired Journalist (agent_5). The nape was painted in the face's skin
  tone, so from behind it looked like a second face; the whole back of the head
  is hair now.\r

  - The network request also fires when a script catches the failed lookup and
  exits 0 (it used to wait for a failing exit code).\r

  - Answering several access requests in a row now tells the member about every
  one (granted and refused) since their last reply; before, only the last answer
  reached them, so a member kept saying it was blocked on a request you had
  already approved.\r

  - `desktop:install` no longer hands the app the shell's `ANTHROPIC_*` /
  `CLAUDE_CODE_*` variables: installing from inside a Claude Code session gave
  every Claude Code member that session's proxy and model names and broke them."
