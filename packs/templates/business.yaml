kind: template
id: business
label: Small business
order: 3
description: Day-to-day help with customers, planning and numbers.
crew:
  - { job: Assistant, function: "Drafts emails and replies to customers and partners." }
  - { job: Analyst,   function: "Reads the numbers the founder shares and explains what changed and why." }
  - { job: Planner,   function: "Keeps the week's priorities short and in order." }
quests:
  - title: Monday plan
    goal: A clear plan for the week.
    steps:
      - { agent: 1, task: "Summarize what the founder shared about last week in five bullet points." }
      - { agent: 2, task: "Turn that into the three priorities for this week, with a first step for each.", seal: true }
