kind: template
id: software
label: Software project
order: 1
description: A small crew that plans, builds and reviews code changes.
crew:
  - { job: Planner,   function: "Turns a request into a short, clear plan with steps and risks." }
  - { job: Developer, function: "Implements the plan in the project folder and runs the tests." }
  - { job: Reviewer,  function: "Reviews the change for bugs and unclear code, and says what to fix." }
parties:                         # starter parties; members are the crew above, by position
  - name: Feature crew
    goal: "Go from an idea to a reviewed change: plan it, build it, review it."
    members: [0, 1, 2]
