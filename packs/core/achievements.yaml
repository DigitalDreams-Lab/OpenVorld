# Deeds: hand-made achievements. `when` is a condition over engine events and counters (tools/lib/dsl.mjs):
#   event:<name>  |  count(event:<name>) >= n  |  <counter> >= n  |  all(...) / any(...)
# Names and descriptions come from the theme (strings.deeds.<id>). hidden: shown as "???" until found.
kind: achievements
version: 1
achievements:
  - { id: vorld_founded,   xp: 10,  icon: flag,    when: "event:vorld.created" }
  - { id: first_words,     xp: 10,  icon: chat,    when: "event:chat.sent" }
  - { id: first_writ,      xp: 20,  icon: key,     when: "event:writ.granted" }
  - { id: first_refusal,   xp: 20,  icon: key,     when: "event:writ.refused", hidden: true }
  - { id: first_party,     xp: 50,  icon: users,   when: "event:party.created" }
  - { id: first_job,       xp: 50,  icon: flame,   when: "event:party.job_done" }
  - { id: crew_of_three,   xp: 40,  icon: users,   when: "crew.agents >= 3" }
  - { id: crew_of_six,     xp: 80,  icon: users,   when: "crew.agents >= 6" }
  - { id: ten_jobs,        xp: 150, icon: trophy,  when: "count(event:party.job_done) >= 10" }
  - { id: fifty_jobs,      xp: 500, icon: trophy,  when: "count(event:party.job_done) >= 50" }
  - { id: full_party,      xp: 100, icon: star,    when: "event:party.big_job" }
  - { id: hundred_hands,   xp: 300, icon: star,    when: "count(event:party.handoff) >= 100" }
  - { id: night_owl,       xp: 25,  icon: eye,     when: "event:chat.night", hidden: true }
