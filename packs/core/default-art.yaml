# A sprite the sheets do not name (a prop an AI designed for one world, an achievement emblem...) takes one cell of the
# pool for its prefix, chosen by the sprite's name (always the same one). `_v<n>` colour variants fall back to the
# base sprite first; 
fallback:
  p_: [p_generic_0, p_generic_1, p_generic_2, p_generic_3]
  i_: [i_emblem_0, i_emblem_1, i_emblem_2, i_emblem_3, i_emblem_4, i_emblem_5, i_emblem_6, i_emblem_7]

# Animal species a companion may be (the cast editor and the world designer pick from this; AI artists draw them).
creatures:
  bee: Bee
  bird: Bird
  cat: Cat
  fox: Fox
  owl: Owl
  bunny: Bunny
  slime: Slime
  wisp: Wisp
  fish: Fish

# Complete illustrated houses are 5x5 square tiles. Their central doorway stays on the plan door.
# Custom artist building sheets use the original modular parts above instead.
illustrated_houses:
  - { id: forge, grid: [5, 5], body_cols: 4, wall_rows: 2 }
  - { id: inn, grid: [5, 5], body_cols: 4, wall_rows: 2 }
  - { id: hall, grid: [5, 5], body_cols: 4, wall_rows: 2 }
  - { id: workshop, grid: [5, 5], body_cols: 4, wall_rows: 2 }
  - { id: cottage, grid: [5, 5], body_cols: 4, wall_rows: 2 }
  - { id: library, grid: [5, 5], body_cols: 4, wall_rows: 2 }
  - { id: observatory, grid: [5, 5], body_cols: 4, wall_rows: 2 }
  - { id: treasury, grid: [5, 5], body_cols: 4, wall_rows: 2 }
