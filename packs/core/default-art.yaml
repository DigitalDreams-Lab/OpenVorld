# The DEFAULT ART: sprite sheets, and nothing else. Nothing in the game is drawn by code: every character, ground tile,
# prop, house block, icon and the plaza landmark is a SPRITE cut from a sprite sheet. This file lays the four default
# sheets out (packs/core/art/default/*.png); replacing a PNG with real art changes the whole look of every world that
# keeps the default art.
#
# Every sprite is a SQUARE. World/building/UI tiles share one size; movement and portrait sheets can have their own
# higher source resolutions. The game keeps world sizes unchanged. Cell sizes are read from each image's grid.
# An object bigger than a tile
# (a tree, a fountain, a house) is made of several sprites placed side by side (`grid` in scenery.yaml, house blocks).
# The only coded graphic left is the colour of the atmosphere light (scenery.yaml lighting).
#
# Sheets in reading order, left to right, top to bottom, `cols` cells per row. A `_` cell is a spare (leave it empty).
# To add a sprite: append it to `cells` (never insert in the middle: that shifts every sprite after it).
kind: default_art
version: 1

characters:
  file: art/default/characters.png
  dirs: [down, down_right, right, up_right, up]
  mirror: { up_left: up_right, left: right, down_left: down_right }   # these three are the flipped pictures of the ones named, so the game has all eight directions
  frames: 4
  portrait: false    # avatars are in the separate portraits.png sheet
  # One row per character, `dirs x frames` = 20 cells left to right (four frames of each drawn direction side by side):
  #   down_0..3  down_right_0..3  right_0..3  up_right_0..3  up_0..3
  # frames 0 and 2 are the contact poses (a leg and the opposite arm forward), frames 1 and 3 are the passing poses
  # (standing neutral: frame 1 is the standing-still pose). The character stands on the bottom edge of its cell, centred.
  # For the companion the four frames are a wing-flap cycle. `for` says who uses the row: the founder, the companion, or
  # `agent`: the agent rows are given to the crew's agents in order (the 1st agent gets the 1st agent row, and so on; every
  # agent is the same kind of character, each row is just another face).
  rows:
    - { id: founder,      for: founder,      note: "the player: always the first row" }
    - { id: companion,    for: companion,    note: "the guide / pet: a small creature, robot or person" }
    - { id: agent_1,       for: agent }
    - { id: agent_2,       for: agent }
    - { id: agent_3,       for: agent }
    - { id: agent_4,       for: agent }
    - { id: agent_5,       for: agent }
    - { id: agent_6,       for: agent }
    - { id: agent_7,       for: agent }
    - { id: agent_8,       for: agent }
    - { id: agent_9,       for: agent }
    - { id: agent_10,      for: agent }
    - { id: agent_11,      for: agent }
    - { id: agent_12,      for: agent }
    - { id: agent_13,      for: agent }
    - { id: agent_14,      for: agent }

sheets:
  portraits:   # same character row order, arranged left-to-right on a separate 4x4 grid
    file: art/default/portraits.png
    cols: 4
    cells: [portrait_founder, portrait_companion, portrait_agent_1, portrait_agent_2, portrait_agent_3, portrait_agent_4, portrait_agent_5, portrait_agent_6, portrait_agent_7, portrait_agent_8, portrait_agent_9, portrait_agent_10, portrait_agent_11, portrait_agent_12, portrait_agent_13, portrait_agent_14]
  world:   # ground tiles (t_), props (p_, in parts), the plaza landmark (b_plaza_)
    file: art/default/world.png
    cols: 8
    cells: [
      t_ground_0, t_ground_1, t_ground_2, t_ground_3, t_path, t_plaza, t_water, t_bridge,   # row 0
      t_void, p_tree_0_0, p_tree_1_0, p_tree_0_1, p_tree_1_1, p_pine_0_0, p_pine_0_1, p_bush,   # row 1
      p_rock, p_flower, p_flower_v1, p_flower_v2, p_flower_v3, p_mushroom, p_mushroom_v1, p_crystal,   # row 2
      p_lamp_0_0, p_lamp_0_1, p_crate, p_cactus_0_0, p_cactus_0_1, p_reeds, p_banner_0_0, p_banner_0_1,   # row 3
      p_banner_v1_0_0, p_banner_v1_0_1, p_banner_v2_0_0, p_banner_v2_0_1, p_tuft, p_pebbles, p_bench_0_0, p_bench_1_0,   # row 4
      p_planter, p_planter_v1, p_planter_v2, p_well_0_0, p_well_1_0, p_well_0_1, p_well_1_1, p_fountain_0_0, p_fountain_1_0, p_fountain_0_1,   # row 5
      p_fountain_1_1, p_stall_0_0, p_stall_1_0, p_stall_0_1, p_stall_1_1, p_stall_v1_0_0, p_stall_v1_1_0, p_stall_v1_0_1,   # row 6
      p_stall_v1_1_1, p_stall_v2_0_0, p_stall_v2_1_0, p_stall_v2_0_1, p_stall_v2_1_1, p_brazier, p_signpost, p_haystack,   # row 7
      p_barrel, p_pylon_0_0, p_pylon_0_1, p_flower_bed, p_flower_bed_v1, p_flower_bed_v2, p_flower_bed_v3, p_generic_0,   # row 8
      p_generic_1, p_generic_2, p_generic_3, b_plaza_0_0, b_plaza_1_0, b_plaza_0_1, b_plaza_1_1,   # row 9
