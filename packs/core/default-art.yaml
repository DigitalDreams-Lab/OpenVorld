      h_door_plank, h_door_arch, h_door_round, h_door_sliding, h_window_square, h_window_arch, h_window_round, h_window_slit,   # row 6
      h_chimney_brick, h_chimney_pipe, h_chimney_stone, h_extra_awning, h_extra_flowerbox, h_extra_lantern, h_extra_barrel, h_extra_sign,   # row 7
      h_extra_vines, h_extra_antenna, h_extra_banner, h_extra_crate, h_extra_plant, _, _, _,   # row 8
