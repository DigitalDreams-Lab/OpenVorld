# How agent work becomes the game: XP, animations, sounds and balloons for every normalized agent event.
kind: interactions
version: 1

agent:
  engine_tools:                    # tools the ENGINE runs for API brains, limited to the member's writs
    enabled: true
    max_rounds: 16
    output_chars: 12000
    command_seconds: 120
    fetch_chars: 20000
    search_matches: 80
  browser:                         # the crew browser: each member browses in its own private Chrome (see engine/server/browser.mjs)
    enabled: true
    viewport: { width: 1024, height: 640 }
    text_chars: 12000              # page text handed to the member per reading
    max_elements: 60               # numbered links, buttons and fields per reading
    nav_timeout_seconds: 20
    idle_seconds: 300              # a browser nobody used for this long is closed
    active_seconds: 6              # keep streaming frames to the game this long after the last action
    frame_ms: 900
    jpeg_quality: 55
    allow_private: false           # localhost and local-network addresses stay blocked
    instructions: |
      You have your own private web browser: the tools browser_open, browser_read, browser_click, browser_type and
      browser_back (your tool list may show a prefix such as ov_browser). The founder can watch it in the game.
      Use it for anything on the web, and do not use any other browser, computer-use or web tool. Each website needs a
      writ: opening one you do not have asks the founder, then you continue when they agree. Read the numbered links
      and fields in each answer, click or type by number, and never type passwords or payment details.
      If a site needs a login, open it with signed_in true. If the founder has not signed in there for you yet, a card
      appears in the chat where they sign in themselves in a real window and approve; wait for that, then try again.
      Signed in, you are acting as the founder: read freely, but anything that posts, sends, buys, deletes or changes
      settings needs net.act for that site, so ask first and do it only once approved.
    act_words: [post, publish, send, submit, buy, purchase, pay, order, checkout, delete, remove, confirm, subscribe, unsubscribe, follow, unfollow, like, comment, reply, share, upload, save, update, book, reserve, approve, accept, withdraw, transfer, donate, schedule, sign out, log out, logout]
  vault:                           # the member's vault of secrets (see engine/server/house.mjs); {names} and {held} are filled in
    instructions: |
      Your vault holds secrets (names only; you can never read the values): {names}. Secrets you may use now: {held}.
      If you need a key, token or any value only the founder has, call the tool secret_ask (name in capitals, and why):
      a private box appears in the chat where they paste it, so never ask them to type a secret in a normal message.
      The same tool asks approval to use a secret you already have. Then write %NAME% where the value belongs in the
      engine's command tool, or $NAME in your own shell. Values are hidden in the chat.
  memory:                          # crew memory: a notebook and chat summaries in each member's house (engine/server/memory.mjs)
    enabled: true
    notes_max: 40                  # notes a member's notebook holds
    note_chars: 300
    summary_chars: 600
    recent_chats: 5                # summaries of the latest other chats a new chat starts with
    recall_results: 5              # chats the recall tool returns for a search
    recall_chars: 8000             # most text the recall tool returns from one chat
    instructions: |
      You keep a notebook between chats. In the ov block at the end of a reply you may add:
        remember: a list of short facts worth keeping for future chats: the founder's preferences, decisions, names,
          accounts, recurring tasks and lessons learned. One fact per item, written to make sense on its own. Never
          secrets or passwords, and nothing that only matters in this chat.
        forget: a list of note ids (the [id] in your notebook) that are wrong or outdated. Forget one before you add
          another when the notebook is full.
        summary: in every reply, 1 to 3 sentences on where this whole chat stands: what was asked, what was decided or
          done, what is still open. It replaces the previous one.
      To look back at older chats, call the tool recall (your tool list may show a prefix such as ov_browser): give a
      query to search them, or a chat id to read one.
  party:                           # parties (engine/server/parties.mjs)
    max_turns: 12                  # most member turns after one message from the founder
    message_chars: 2500            # longest message of the room shown to a member
    room_events: 40                # how many of the latest room messages a member is shown
  transcript: { output_chars: 4000, detail_chars: 1500 }
  chat: { collapse_after: 6 }
  claude_code:
    always_tools: [TodoWrite]      # harmless tools every Claude Code member gets

# XP rules (small for chat, real for finished work)
xp:
  chat_message: 2
  chat_per_day: 60                 # chat XP stops here each day
  party_done: 40                   # a party finished a job
  writ_granted: 5

levels: { base: 60, exponent: 1.6 }   # XP to reach level n = base * (n-1)^exponent

# agent event -> reaction on the map (anim id, balloon string key). The crew's work is silent; sounds are notifications (client/src/notify.ts)
reactions:
  turn.start:   { anim: think, balloon: balloon.thinking }
  tool.read:    { anim: read_scroll }
  tool.search:  { anim: read_scroll }
  tool.web:     { anim: gaze }
  tool.edit:    { anim: hammer }
  tool.write:   { anim: hammer }
  tool.run:     { anim: bellows }
  tool.vorld:   { anim: idle }
  tool.error:   { anim: wince }
  test.pass:    { anim: cheer, balloon: balloon.tests_pass }
  test.fail:    { anim: wince, balloon: balloon.tests_fail }
  writ.request: { anim: bow }
  turn.error:   { anim: faint, balloon: balloon.error }

# The reply envelope every member is asked to follow. Plain text is always accepted.
envelope:
  block_lang: ov
  instructions: |
    Reply in plain prose (Markdown allowed). Keep it short unless asked for depth.
    At the very end, add one fenced block with language "ov" holding JSON, for example:
    ```ov
    {"options": ["Show me", "Draft a plan"], "mood": "happy", "balloon": "Fresh ideas!", "title": "Launch plan"}
    ```
    options: 0-4 short replies the founder may click. mood: neutral|happy|thinking|worried|proud.
    balloon: under 6 words, shown over your head in the vorld. title: name for this chat (first reply only).
    commands: optional things you DO on the vorld's map; see "Acting in the vorld" below.
    access: only when you need access you do not have, a list like
      [{"capability": "fs.read", "scope": "/path/to/folder", "why": "to read the landing page copy"}]
      capability is one of fs.read, fs.write, cmd.run (scope = a command pattern, "*" for any arguments, e.g. "npm test" or "curl *"),
      net.fetch (scope = a domain), net.session (browse signed in as the founder; scope = one site), net.act (act as the founder there:
      post, send, buy, delete). The founder sees it as a request and answers; do not ask in prose only.
