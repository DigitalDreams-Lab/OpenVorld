# The default theme: the names, words, palette and sounds of a vorld. A user pack can override any of it
# (~/.openvorld/packs or <vorld>/packs), so the same engine can be a village, a space station or an office.
kind: theme
id: default
version: 1
label: Default vorld
palette: { ink: "#1b1622", parchment: "#f1e2bf", gold: "#d9a441", lapis: "#2c4f9e", turquoise: "#3fb5a8", clay: "#b5653b", danger: "#b8322a" }

companion: { name: Buzz, form: creature, species: bee, voice_style: "short, warm, playful sentences" }
agent_names: [Quinn, Nico, Stella, Mercer, Sibyl, Brand, Maya, Puck, Rowan, Iris, Tobin, Wren]
agent_voice: "friendly, clear and practical"

buildings:
  party_hall: Party Hall

# A title for every five levels (the last one stays).
level_titles: [Newcomer, Apprentice, Organizer, Builder, Steward, Captain, Architect, Visionary, Legend]

strings:
  writ:
    allow_once: Allow once
    allow_session: Allow for this session
    allow_always: Always allow
    deny: Refuse
  chat:
    open_member: "Chat with {name}"            # a member's portrait or name in a party chat
    open_leader: "Chat with {name} (leader)"   # the same, for the party's leader
  scripted:
    companion: "Hi, I am {name}. I have no mind yet, so I can only say this: pick a brain for me in my settings (Claude Code, Codex or any OpenAI-compatible model) and I can really help. Meanwhile, open the Party Hall and form a party."
    agent: "{name} waves but stays quiet. Pick a brain for {name} in their settings."
    options: ["Open the Party Hall", "Open Settings"]
  balloon:
    thinking: "Hmm..."
    tests_pass: "Tests pass!"
    tests_fail: "Tests failed."
    error: "Something broke..."
    needs_writ: "Needs access"
  deeds:
    vorld_founded:  { name: First Stone, desc: Found your vorld. }
    first_words:    { name: Hello There, desc: Talk to a crew member for the first time. }
    first_writ:     { name: Keys Handed Over, desc: Grant your first writ. }
    first_refusal:  { name: Not This Time, desc: Refuse a writ., hint: Not every request deserves a yes. }
    first_party:    { name: Fellowship, desc: Form your first party. }
    first_job:      { name: Job Well Done, desc: A party finishes a job together. }
    crew_of_three:  { name: Small Crew, desc: Have three agents. }
    crew_of_six:    { name: Busy Crew, desc: Have six agents. }
    ten_jobs:       { name: Routine, desc: A party finishes ten jobs. }
    fifty_jobs:     { name: Well-Oiled Machine, desc: A party finishes fifty jobs. }
    full_party:     { name: Full Party, desc: Three or more members take part in one job. }
    hundred_hands:  { name: Hundred Hands, desc: A hundred hand-overs between party members. }
    night_owl:      { name: Night Owl, desc: Talk to your crew between 2 and 4 at night., hint: The stars keep late hours. }
