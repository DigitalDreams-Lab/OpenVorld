releaseNotes: "- Write to a member while they work: Enter sends now and stops
  the current reply (what they had written stays in the chat), Ctrl+Enter or
  Cmd+Enter queues the message above the box. Queued messages run one after
  another and can each be edited, deleted or sent now; they work in party rooms
  too, and survive switching chats and reloading. Stop pauses the queue until
  you resume it."
