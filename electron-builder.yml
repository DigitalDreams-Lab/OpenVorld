appId: org.openvorld.desktop
productName: OpenVorld
asar: false
directories:
  output: release
files:
  - desktop/main.mjs
  - desktop/runtime.mjs
  - desktop/updates.mjs
  - desktop/assets/icon.png
  - engine/server/**
  - engine/client/dist/**
  - tools/lib/**
  - tools/release-notes.mjs
  - packs/**
  - package.json
  - LICENSE
  - CHANGELOG.md
  - '!**/*-guide.png'
  - '!**/node_modules/playwright-core/.local-browsers/**'
npmRebuild: false
publish:
  provider: github
  owner: DigitalDreams-Lab
  repo: OpenVorld
  releaseType: release
mac:
  category: public.app-category.productivity
  icon: desktop/assets/icon.icns
  identity: '-'
  target:
    - dmg
    - zip
  extendInfo:
    NSMicrophoneUsageDescription: OpenVorld uses the microphone when you choose voice input.
win:
  icon: desktop/assets/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: desktop/assets/icon.png
  category: Office
  target:
    - AppImage
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
